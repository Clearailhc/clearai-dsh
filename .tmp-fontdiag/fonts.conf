<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  飞书 / Lark Linux 客户端字体映射（用户级覆盖，放在 ~/.config/fontconfig/fonts.conf）

  背景：飞书前端的 CSS 点名了一批 macOS / Windows 才有的字体，本机没有：
    主界面 : LarkHackSafariFont(@font-face src:local("Helvetica Neue")), LarkChineseQuote,
             -apple-system, PingFang SC, Microsoft Yahei, Hiragino Sans GB, Arial, Tahoma
    日程卡 : DINAlternate, PingFangSC-Regular, Myriad Pro
  缺字体时 fontconfig 会各自兜底，中文和数字落到不同字体、字距/字重都不统一。

  本文件把"飞书点名的字体名"显式指到本机已有的字体上。
  删除本文件 + fc-cache -f 即可完全还原。
-->
<fontconfig>

  <!-- ================= 1. 中文：苹方 / 微软雅黑 / 冬青黑体 / 宋黑 ================= -->
  <!-- 统一走 Noto Sans CJK SC（本机已装，Linux 上的标准中文黑体） -->

  <match target="pattern">
    <test name="family" compare="contains"><string>PingFang</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Yahei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>Hiragino</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>Heiti</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Source Han Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>思源黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <!-- 飞书用来渲染中文引号的 @font-face 族名 -->
  <match target="pattern">
    <test name="family" compare="eq"><string>LarkChineseQuote</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- ================= 2. 西文正文：Helvetica Neue 系 ================= -->
  <!-- 飞书主界面首选 Helvetica Neue；本机用 Nimbus Sans（Helvetica 克隆，度量/字形最接近） -->

  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>HelveticaNeue</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <!-- LarkHackSafariFont 的 @font-face 就是 src:local("Helvetica Neue")，靠别名让 local() 命中 -->
  <match target="pattern">
    <test name="family" compare="eq"><string>LarkHackSafariFont</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Myriad Pro</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Nimbus Sans</string></edit>
  </match>

  <!-- ================= 3. 数字：DIN Alternate ================= -->
  <!-- 日程卡片给日期/时间用的就是 DINAlternate。用 Ubuntu Sans 顶替：
       同样是几何无衬线、数字不带底横、字重偏细，字形和现在看到的数字最接近。 -->
  <match target="pattern">
    <test name="family" compare="contains"><string>DINAlternate</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Ubuntu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>DIN Alternate</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Ubuntu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>DIN-Alternate</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Ubuntu Sans</string></edit>
  </match>

  <!-- ================= 4. 等宽：Consolas / Monaco / 飞书代码字体 ================= -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Monaco</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Andale Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>ClarityMono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>SourceCodePro</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>

  <!-- ================= 5. 其它 Windows / macOS 名字 ================= -->
  <match target="pattern">
    <test name="family" compare="eq"><string>ArialMT</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>SF Pro</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Ubuntu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Ubuntu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>ProximaNova</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Ubuntu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Microsoft JhengHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- ================= 6.（可选）拆掉 fonts-arphic-ukai 的通用别名 =================
       包 fonts-arphic-ukai 会带一条 /etc/fonts/conf.d/65-fonts-arphic-ukai.conf，
       把 serif / sans-serif / monospace 都 alias 到 AR PL UKai（楷体）作为弱兜底。
       平时被 Noto CJK 压住，但如果你想彻底避免"某些地方中文变楷体"，取消下面注释：

  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="delete" binding="weak"><string>AR PL UKai CN</string></edit>
    <edit name="family" mode="delete" binding="weak"><string>AR PL UKai HK</string></edit>
    <edit name="family" mode="delete" binding="weak"><string>AR PL UKai TW</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="delete" binding="weak"><string>AR PL UKai CN</string></edit>
    <edit name="family" mode="delete" binding="weak"><string>AR PL UKai HK</string></edit>
    <edit name="family" mode="delete" binding="weak"><string>AR PL UKai TW</string></edit>
  </match>
  -->

</fontconfig>
