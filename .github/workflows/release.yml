name: Release

# tag 即版本。三道门:
#   ① tag 必须与 package.json 的 version 一致;
#   ② 发布前所有自检必须绿;
#   ③ 发布**之后**核对:registry 上那一份与本 commit 构建的逐文件一致。
#
# 发布身份用 npm 的 **Trusted Publishing**(OIDC:没有长期令牌,也不需要 OTP):
#   · 在 npmjs.com 的包设置里把它配成该包的 trusted publisher
#     (Repository: Clearailhc/clearai-dsh · Workflow filename: release.yml · Environment 留空);
#   · 本文件声明 `id-token: write`(见下面 permissions);
#   · **runner 上的 npm 必须 ≥ 11.5.1** —— OIDC 交换是 npm CLI 自己做的,旧 npm 不认识它,
#     只会甩一句 ENEEDAUTH。Node 22 自带 npm 10.9.8,所以这里跑 Node 24;下面还有一道明写的门。
#   · 用 OIDC 时**不要**给 setup-node 传 `registry-url`:它往 .npmrc 写
#     `_authToken=${NODE_AUTH_TOKEN}`,而这条路下那个变量不存在 —— 那是另一条会让人查半天的错。
#     包没有 scope、发的是默认 registry,本来就不需要那行。
#
# 2026-09-15 的教训:这条发布路径**连续三版都没有真的执行过** ——
# 0.1.0/0.1.1/0.1.2 都是人**手工先发**,于是幂等分支每次 `exit 0`、workflow 报绿。
# 等到 v0.1.3 第一次真去发,2 秒被拒(没有身份)。所以现在:不管这一版是发出去的还是跳过的,
# 最后都必须被核对成「registry 上确实有这一份,而且内容就是本 commit 构建的」——
# 门的绿要自己挣来,不能靠一句 `exit 0`。
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing 要它
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 自带 npm ≥ 11.5.1;trusted publishing 的硬要求就是它。
          node-version: '24'
      - name: npm 必须够新(OIDC trusted publishing 的最低要求)
        # 明写这道门:达不到就**现在**红,而不是等到最后甩一句 ENEEDAUTH 让人回查半天。
        run: |
          echo "node $(node --version) · npm $(npm --version)"
          node -e '
            const want = [11, 5, 1]
            const got = process.argv[1].split(".").map(Number)
            const ok = got[0] > want[0] || (got[0] === want[0] && (got[1] > want[1] || (got[1] === want[1] && got[2] >= want[2])))
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} 太旧 —— trusted publishing 需要 ≥ 11.5.1(用更新的 node,或 npm install -g npm@latest)`)
              process.exit(1)
            }
          ' "$(npm --version)"
      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version
      - name: Tag must match the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          echo "tag=$tag manifest=$manifest"
          [ "$tag" = "$manifest" ] || { echo "::error::tag $tag does not match package.json $manifest"; exit 1; }
      - name: Suites
        run: npm test
      - name: Build and self-check
        run: |
          node tools/build-package.mjs
          node tools/verify-package.mjs
      - name: Install the DSH CLI
        run: npm install --no-save --prefix "$RUNNER_TEMP/dsh-cli" @deepseek-ai/dsh
      - name: Clean install (mechanical half)
        env:
          DSH_CLI_PREFIX: ${{ runner.temp }}/dsh-cli
          DSH_CHECKOUT: ${{ github.workspace }}
        run: node tools/verify-clean-install.mjs
      - name: Publish the built package
        # 从 dist/ 发布:仓库根的 package.json 永不发布。
        # **幂等**:0.1.0 是手工首发(2FA 只能人敲),之后再打同一个 tag 不能让 CI 红着报
        # "version already published" —— 先问 registry 有没有这个版本,有就跳过。
        # 但"跳过"不再等于"没发布成功":下面那道核对会把两种情形都验成同一个事实。
        # `--provenance` 在 trusted publishing 下已是默认行为,留着是为了「退回 granular token」那条路也对。
        # 退回令牌方式时:给 setup-node 加回 registry-url,并加 NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}。
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "clearai-dsh@$version" version >/dev/null 2>&1; then
            echo "::notice::clearai-dsh@$version 已经在 registry 上 —— 本次没有发布任何东西(首发是手工完成的,幂等跳过)"
          else
            echo "registry 上还没有 $version → 发布 dist/clearai-dsh"
            npm publish ./dist/clearai-dsh --access public --provenance
          fi
      - name: Registry must carry exactly this source
        # 「跳过」那条路的解药,也是发布本身的自检:不管上面是**发了**还是**跳了**,
        # 都要求 registry 上那一份与本 commit 构建的**逐文件一致**。
        # 没有它,一次静默的失败、或一次用手工发的**内容不同**的版本,都能让 tag 报绿。
        # 这条比对在 2026-09-15 用已发布的 0.1.2 实测过:与 v0.1.2 那棵树逐文件相同。
        run: |
          version="$(node -p "require('./package.json').version")"
          ok=0
          for attempt in 1 2 3 4 5; do
            url="$(npm view "clearai-dsh@$version" dist.tarball 2>/dev/null || true)"
            if [ -n "$url" ] && curl -fsSL "$url" -o "$RUNNER_TEMP/published.tgz"; then ok=1; break; fi
            echo "registry 上还拿不到 $version 的 tarball,5 秒后重试($attempt/5)"
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::registry 上没有 $version 的可下载 tarball —— 这一步没有发布成功"; exit 1; }
          mkdir -p "$RUNNER_TEMP/published"
          tar -xzf "$RUNNER_TEMP/published.tgz" -C "$RUNNER_TEMP/published"
          # INVENTORY.txt 是**构建自己的**文件清单,不在清单的 files 白名单里,发行物里本来就没有它。
          diff -r "$RUNNER_TEMP/published/package" dist/clearai-dsh --exclude=INVENTORY.txt
          echo "registry 上的 $version 与本 commit 构建的逐文件一致 ✓"
