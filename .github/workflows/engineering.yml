name: Engineering gates
on:
  workflow_call:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22'}
          - {os: ubuntu-latest, node: '24'}
          - {os: windows-latest, node: '24'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DSH_PROFILE: check
      CLEARAI_REQUIRE_INSTALLED_TESTS: '1'
    steps:
      - name: Preserve full evidence paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Isolated runtime paths
        run: |
          echo "CLEARAI_DSH_RESOURCES=$RUNNER_TEMP/dsh-cli" >> "$GITHUB_ENV"
          echo "DSH_HOME=$RUNNER_TEMP/clearai-check" >> "$GITHUB_ENV"
      - run: npm ci
      - run: corepack enable && pnpm --version
      - run: node tools/check-workspace-residue.mjs
      - run: npm install --no-save --prefix "$CLEARAI_DSH_RESOURCES" @deepseek-ai/dsh@0.2.2-rc.1
      - run: node tools/build-package.mjs
      - run: node tools/native-headless/setup.mjs "$DSH_HOME" "$DSH_PROFILE"
      - name: Expose installed host dependency fallback to standalone test processes
        run: node -e "require('fs').symlinkSync(require('path').join(process.env.CLEARAI_DSH_RESOURCES,'node_modules'),require('path').join(process.env.DSH_HOME,'node_modules'),'junction')"
      - run: npm test
      - run: node tools/verify-package.mjs
      - run: node tools/native-headless/native-contract.mjs "${{ runner.temp }}/native-contract"
      - name: Native install, upgrade, uninstall and reinstall
        run: node tools/native-headless/lifecycle.mjs "${{ runner.temp }}/native-lifecycle" --versions=0.5.7
      - name: User configuration preservation and lifecycle
        if: runner.os == 'Linux'
        env:
          DSH_CLI_PREFIX: ${{ runner.temp }}/dsh-cli
          DSH_CHECKOUT: ${{ github.workspace }}
        run: |
          export PATH="$CLEARAI_DSH_RESOURCES/node_modules/.bin:$PATH"
          node tools/verify-clean-install.mjs
          node tools/verify-lifecycle.mjs
      - name: Production panel browser checks
        if: runner.os == 'Linux'
        run: |
          npx playwright-core install --with-deps chromium
          export CHROME_PATH="$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")"
          node tools/browser-panels-check.mjs
