name: CI

# 每次 push / PR 都跑:五份套件 + 打包自检 + 真实装配。
# 最后一条「干净安装」要 dsh CLI 与 pnpm,所以单独一步装它们 —— 那条路正是陌生人走的那条。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # CI 跑 engines 的下界(22)。发布那条流水线用 Node 24,因为 trusted publishing 要求
          # npm ≥ 11.5.1,而 Node 22 自带 10.9.8 —— 两处刻意不同,别顺手统一。
          node-version: '22'
      - name: Install dependencies
        # `npm test` 的第一步是 `build-vendor`(esbuild),打包自检(build-package → buildVendor)
        # 也要它。0.2.1 之前 `test` 只是 `bash test/run.sh`(纯 Node、零依赖),所以这里一直没有
        # 安装步骤;图谱那一版给 test 加了 vendor 构建,于是缺依赖会在第一秒就红(2026-09-18 撞到)。
        run: npm ci
      - name: Enable pnpm (the CLI forwards to it)
        run: |
          corepack enable
          pnpm --version
      - name: Suites
        run: npm test
      - name: Package is a pure function of the source
        run: |
          node tools/build-package.mjs
          node tools/verify-package.mjs
      - name: Install the DSH CLI
        run: npm install --no-save --prefix "$RUNNER_TEMP/dsh-cli" @deepseek-ai/dsh
      - name: Put the DSH CLI on PATH
        # 下面两个验收都**优先用 PATH 上的 `dsh`**(找不到才退回 npx)。挂上它,GITHUB_PATH
        # 之后的步骤就看得见 —— 而 `npx --no-install` 在缓存冷的时候会**静默返回空串**,
        # 空串能让负向断言假通过(2026-09-15 撞到过)。
        run: echo "$RUNNER_TEMP/dsh-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Clean install (mechanical half)
        env:
          DSH_CLI_PREFIX: ${{ runner.temp }}/dsh-cli
          DSH_CHECKOUT: ${{ github.workspace }}
        run: node tools/verify-clean-install.mjs
      - name: Lifecycle (upgrade / uninstall / user fork / the install verb)
        # 唯一验「时间轴上的行为」的闸门:换版本重装、卸载四处归位、播种不覆盖人改过的文件、
        # 以及随包那个 `install` 动词。它以前**哪都不自动跑**,于是一道永远打不开的比对在里面
        # 烂了很久(2026-09-15 一并修掉)。放进 CI:每次 push 都真的走一遍。
        run: node tools/verify-lifecycle.mjs
