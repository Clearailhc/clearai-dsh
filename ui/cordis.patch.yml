# ClearAI 的 bundle 补丁:以 DSH bundle 方式安装时(dsh plugin --profile <p> add <spec>),
# 这一层会被自动加进 `dsh.profile.bundles`,不需要用户手改自己的 cordis.patch.yml。
#
# 只做一件事:把宿主半挂进宿主平面。
#   · 客户端模块扫描只扫宿主 Loader 的行,所以面板那一半必须由这里挂上;
#   · 行名用**包名**,由 profile 的 node_modules 解析(与 dsh-base / dsh-web-app 同一套)。
# 预设那一半不在这一层:它是 agent preset(目录形态),由包里的 `preset/` 提供,
# 装完用 `bin/clearai.mjs link` 软链到 ~/.dsh/.agent-presets/clearai(升级自动跟随)。
- insert:
    - id: clearai-host
      name: 'clearai-dsh'
