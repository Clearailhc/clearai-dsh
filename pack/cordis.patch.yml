# clearai-dsh 的 bundle patch:宿主平面的一行。
#
# 为什么宿主半必须在**补丁层**而不是 agent 预设里:
# 客户端模块扫描只扫宿主 Loader 的行 —— 预设里的行浏览器看不见,面板就长不出来。
# 而投影单元 `clearai`(把工具写下的变更记录折成视图)也是宿主平面的:它在会话日志上注册一个投影,
# 多个会话共享同一个注册表。
#
# 行名用**包名**(不是文件路径):Loader 从组合自身的 base 解析它,也就是装进 profile 的那份包。
# 打包纪律④:发行物里不出现任何绝对路径,也不出现仓库结构。

- insert:
    - id: clearai-host
      name: 'clearai-dsh'

# ── 预设不在这里声明 root:宿主的名册不扫目录(本包要求宿主 ≥0.2.0-rc.2)──────────
#
# 0.2.3 及以前走的是「root 目录」机制:宿主自带 `- id: agent-presets` 行,本文件覆盖它的
# config,把 root 指到包内 presets/,归属落在 system 信任层。
#
# 0.1.7-alpha.1 起宿主把这一整套换成了**组合里的声明行**:
#   · `- id: agent-preset-registry`(@deepseek-ai/dsh-agent-preset-registry)只剩
#     default / selectedDefault —— `includeShippedRoot` / `includeUserRoot` / `roots` 全部消失;
#   · 每个预设是一条 `- id: preset-<id>` 行(@deepseek-ai/dsh-agent-preset),
#     `config.plugins` 里放整份插件列表。
#
# 所以旧的那段 `- id: agent-presets` 覆盖在这里**没有落点**(该 id 已不存在于新宿主),
# 已于 2026-09-28 删掉 —— 留着只会让下一个人以为预设还靠目录扫描。
# 依据与实测:`lab/release/0.2.3-release-blocker.md`、`lab/adapter/0.2.4-design.md`。
#
# 预设本体现在由 `presets/clearai/clearai.patch.yml` 承载(构建期由 preset/agent.cordis.yml
# 生成,经 package.json 的 `dsh.bundle.patch` 数组挂上)。想改预设的人:把声明行复制一份、
# 换一个 id,作为自己的 bundle patch 装(`clearai-dsh seed` 那条播种到用户根的路已随旧名册删掉)。
