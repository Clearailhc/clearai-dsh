# 自动生成,不要手改 —— 源是 preset/agent.cordis.yml 与 preset/preset.yml,
# 由 tools/build-package.mjs 装配(包 = 源的纯函数;verify-package 会现场重建再比对)。
#
# 宿主 ≥0.1.7-alpha.1 的 agent-preset-registry 读的就是它:
# 预设 = 组合里的一条声明行,plugins 是下面这份插件列表。
# 0.2.3 及以前靠 root 目录扫描,那条路在新宿主上已经不存在了。

- insert:
    - id: preset-clearai
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: clearai
        name: ClearAI
        description: |-
          利用认识论循环构建可信本体。Build a trustworthy ontology through the epistemic loop.
        order: 10
        plugins:
          # The `clearai` agent preset: ClearAI 的「单循环 + 事实边界」认识论,作为一个可挂载的会话组合。
          #
          # 这份文件是一份 AGENT-PLANE 组合。名册(roster)把它挂在**一个 standing scope** 下,
          # 每个选择它的会话以 scope 父子关系加入;因此这里的工具与提示词段覆盖每个加入的 agent,
          # 而每个会话自己的状态按 Session/Agent 键在插件内部区分。
          #
          # 平面规则(为什么这样分):
          #   · 认识论属于「一个会话的能力集」→ 预设平面(本文件 + ./plugins/clearai-kernel.js)
          #   · 沙箱、审批、文件策略、模型路由、子代理注册表、持久化 → 宿主平面,**本文件一行都不碰**
          #     (DSH 的硬约束:预设 exactly as privileged as the plugins it names;让它放宽自己的关押就废掉了关押)
          #   · 循环面板的浏览器 UI 必须在宿主平面(客户端模块扫描只扫宿主 Loader 的行),
          #     所以它不在本文件里,而在 profile 的 cordis.patch.yml 一行。
          #
          # 本内核**不发布任何服务**(工具、guard、提示词段、web 路由都由同一个插件在自身 fiber 内注册),
          # 因此这一行可以坦然坐在预设里,不需要 isolate realm。realm 是给「预设真的拥有一个服务」用的。

          # ── 身份 ────────────────────────────────────────────────────────────────────

          # 预设自己的 persona,覆盖部署默认。`{{model}}`/`{{cwd}}` 由 agent 自己的路由与工作区解析。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '你是 ClearAI 的主人格,运行在 DeepSeek Harness 上。怎么工作见下面三段:身份、循环、对人说话。'
              suffix: 你的工作目录是 {{cwd}}。工作区就是用户的文件夹;`clear/` 是系统的目录,其余目录都是用户的。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              # 项目章程走**原生指令文件**这一条:空工作区铺下的 `PROJECT.md` 会被宿主当作
              # 工作区指令基线注入(内容变了整份替换、字节有预算),我们一行代码都不用写。
              # 候选名按 ClearAI 的 `taxonomy.json:special_files.constitution` 补一个。
              instructionFileCandidates:
                - PROJECT.md
                - AGENTS.md
                - CLAUDE.md

          # ── shell ───────────────────────────────────────────────────────────────────

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── 文件系统 ────────────────────────────────────────────────────────────────

          # 两行都只注册进宿主 `tools` 注册表、不发布任何服务,所以不需要 realm。
          # `fs` 服务与它的观察策略留在宿主:读前先看(observation policy)是宿主不变量,不是本预设的选择。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── 后台任务 ────────────────────────────────────────────────────────────────

          # 只挂模型面的控制工具。任务注册表留在宿主(bash 工具用 ctx.get 解析它,预设内部的作用域看不见),
          # 它本来就按 owning agent 键,一个宿主实例服务所有会话。
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── 技能(原生技能目录) ─────────────────────────────────────────────────────────────

          # 技能注册表在宿主并按 scope 分层:这两行注册进**本预设的层**,所以不需要 realm。
          # `customSkillDirs` 指向本预设自己的 skills/ —— 哲学文本随预设走,`baseUrl` 就是预设目录,
          # 因此整份预设被复制到任何部署,技能都跟着到位。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── 目标与计划模式交给原生(第三阶段) ─────────────────────────────────────────
          # 目标的文字、续跑、暂停、完成都在原生 goal 上:模型用 create/get/update_goal,人用 /goal 与界面。
          # ClearAI 只往当前 goal 上挂判据与判断(Frame),完成只能经 Conclude(先过独立评估);
          # 模型直接调 update_goal(action=complete) 会被内核守卫拒绝。
          # 人想先审计划,用原生 /plan(计划模式,exit_plan_mode 交人审阅);ClearAI 不再自带审阅卡与授权记号。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── 压缩(上下文是受控资源) ─────────────────────────────────────────────────

          # `compaction-basic` 通过 ctx.get 读 `toolResultPruner`,所以剪枝器必须与它同一个 realm。
          # `tokenMeter` 刻意在 realm 之外:它在宿主,按 Session 折叠,拥有浏览器读的上下文计量投影单元。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── 认识论内核(本预设的灵魂) ───────────────────────────────────────────────

          # 7 件意图工具(目标 2 + 计划 5,见 `MECHANISM_TOOLS`;领域本体没有工具,
          #   模型用原生文件工具直接写 clear/ontology/{concepts,relations,entities}/**.json)
          # + 一个 guard + 每回合派生的运行态卡 + 面板数据路由。
          # 逐条对照 docs/loop-philosophy.md 的哲学,见 ./plugins/clearai-kernel.js 的文件头。
          #
          # 宿主已经有的不再自带:文件改动历史归 workspace-changes,技能归原生技能目录,
          # 并行探索归原生 subagent / workflow(竞争路线就是竞争的假设,各由一个步骤检验)。
          #
          # 装配是**清单驱动**的:工具面、提示词段、机制开关全部查表,代码里不出现模式名。
          #
          # 目标挂在原生 goal 上:Frame 挂判据与判断(没有原生 goal 就建一枚),Conclude 先过独立评估、
          # 通过才把原生 goal 置为完成;续跑由原生 goal 的驱动自己做。需要人而没人能答、或模型如实放弃时,
          # 内核把原生 goal 置为阻塞并写明原因。
          # 配置项就是机制的旋钮:
          - id: clearai-kernel
            # 用**包内子路径**而不是 `./plugins/…`:宿主 ≥0.1.7-alpha.1 起,预设是声明行
            # (presets/clearai/clearai.patch.yml)里的 plugins 列表,相对基准不再是本文件所在目录 ——
            # 实测 `./plugins/clearai-kernel.js` 会以「never started」出现在名册的 broken 里。
            # 包名 + 子路径从 profile 的 node_modules 解析,与宿主解析其它插件名同一条路,
            # 由 package.json 的 `"./presets/*"` 导出放行。
            name: 'clearai-dsh/presets/clearai/plugins/clearai-kernel.js'
            config:
              # 连拦阈值:同一件事连续冲闸这么多次没过,计划置 blocked、停下等人。
              # 默认 3;这里写 2 是产品立场「人就在旁边,早点回来问」。它是**质量闸,不随运行档变**。
              #
              # 注意:同一个键在这个 config 里只能出现一次——YAML 的重复键会让 yaml 包直接抛错,
              # 而 DSH 的加载器是**静默取值**的,所以重复键会以"另一个值生效"的形式骗过所有人。
              blockedThreshold: 2
              # brief 质量门:低于此长度只警告不阻断(brief.py)
              minBriefChars: 280
              # L4 必须有人放行:用宿主审批瀑布的 ask 实现(ClearAI 文档写了、代码未实现的那一条)
              l4RequiresHumanRelease: true
              # L4 只认外部来源:做的人自己写过的路径不算观测
              l4RejectSelfWritten: true
              # 假设数量下限:首次立目标至少登记 2 条候选假设(0 条一样拦)。候选对比是检验的前提——
              # 只有一个猜想时,「验证」容易退化成找证据支持自己。修订目标不受此限。
              # 内核缺省是 0(=机制中立);**这里写 2 是产品立场**,所以它是硬门,不是文案。
              minHypotheses: 2
              # 实体门(结案唯一的结构关口):将要升格的判断里,断言主体还不是实体图上的节点 ⇒ 结案被拒
              # (在派评估者**之前**拦)。只有散文、没有断言的判断不拦,那只是卡上的一条缺口。
              # 为什么要有它:「本体写得漂亮、实体图是空的」是这套系统最容易交付出来的假完成
              # (真实运行:451 条查到的实体,实体图 0 节点 / 0 边,而卡上写着「结构完整」)。
              # 出口两条:给主体写实体文件 clear/ontology/entities/<id>.json(升格会落下边,不必再写同一句话),
              # 或把断言从判断上拿掉 / 如实 abandoned。
              # 「跳级没写理由」与「将升格的命题没有断言形态」两道门在第四阶段删了(依据见 less-is-more-plan)。
              requireLandedEntities: true
              # 判据修订门:改判据文本要带一份独立裁决的 auditKey。
              # 为什么要有它:判据是"怎样算完成",它一变前面所有工作的验收含义跟着变——
              # 允许在同一次 Frame 里顺手改掉,等于允许把"做不到"重新定义成"做到了"。
              requireCriteriaVerdict: true
              # deny_rules 十条里可移植的九条(路径越狱那条不搬:宿主沙箱已经拥有它,ClearAI 自己也说「不重复」)
              bashDenyRules: true
              # 独立评估者:spawn = fresh context(fork 会继承历史,做的人与判的人就分不开了)
              auditProvider: spawn
              auditTimeoutMs: 240000
              # 评估者只读:工具面只给 read/glob/grep;provider 不支持时会降级,降级事实写进台账
              # 评估者可以复跑:内核把工作区(不含 clear/)复制到临时目录,评估者在副本里跑产物自带的脚本核数字,
              # 工具面因此多一个 bash;原工作区只读。L3「可重跑」这才名副其实。
              auditRerun: true
              auditToolFilter:
                - read
                - glob
                - grep
                # 看图也是读:评估者要能核图表类产物(只在挂了 attachments 的部署里存在,
                # 内核会按工具注册表把它过滤掉,见 resolveToolFace)
                - read_image
              # 每回合派生的运行态卡(只在状态变化时注入:前缀稳定是硬约束)
              runtimeCard: true
              # 上下文预算不在这里:那是原生 `dsh-token-meter` + `dsh-compaction-basic` 的活。
              # 贡献表(ClearAI `composition.py` 的装配语义):装配根遍历清单,清单里出现表外的名字
              # 当场抛错——未知机制 / 未知工具 / 未知段 / 已关机制却仍列着它的工具,四种错法都在装配期炸,
              # 而不是静默少装一件工具、等某一轮才发现。
              #
              # 这里只写**机制开关**;tools / sections 缺省 = 目录全量(7 件意图工具、3 段提示词,全部在场)。
              # 这些数字不靠人眼维持:`node tools/verify-truth-table.mjs` 会拿代码算出来的数核对它们。
              # 要裁剪就把 tools 或 sections 显式写出来:
              #   tools: [Frame, CreatePlan, AdvancePlan, ...]      # 名字必须都在工具目录里
              #   sections: [clearai/identity, clearai/loop, clearai/speaking]
              contributions:
                mechanisms:
                  goal: true
                  plan: true

          # ── 工作方式(非权威能力,交还原生) ──────────────────────────────────────────

          # todo / 子代理 / workflow / ralph 是**工作方式**,不是认识论:它们一件 clearai 变更都
          # 产不出来(权威边界测试钉死:变更字面量只在内核、入口被标记把守)。模型干活不设限,
          # 但结论要进权威账本,只能由主线自己过观测准入与唯一完成动词。
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # `subagents` 注册表与 spawn/fork 后端在宿主平面;`workflows` 是谁都不在外面读的服务,
          # 所以到达它的行共享这一个 entry-local realm(与 standard 预设同形)。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              # 执行者自选模型:重活可以换模型跑(modelSelectionSettings 出面板设置)。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              # fork 不开模型选择:provider/model 与父保持一致,继承的历史才能继续吃 KV Cache。
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # 2026-09-28:workflow 引擎换代 —— 旧宿主是 `dsh-workflow-worker-thread`,
              # 宿主 ≥0.1.7-alpha.1 里换成 `dsh-workflow-ptc`(前者已下线,是另一支实现)。
              # 它必须与下面两条工具**同处这个 `isolate: { workflowEngine: true }` 的 realm**,
              # 否则 tool-workflow / tool-ralph 会一直「waiting for workflowEngine」——
              # 名册会给这个预设记一条 broken(实测实录)。
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── 其余模型面 ──────────────────────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # `web` 服务与它的搜索提供者在宿主:这里只挂模型面的工具。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── 刻意不挂的行(是决策,不是遗漏) ─────────────────────────────────────────
          #
          # (原先这里还有 `tool-goal` / `command-goal` / `plan-mode`:第三阶段起它们都挂上了,
          #  目标与计划审阅交给原生,见上面「目标与计划模式交给原生」那一节。)
          #
          # 曾经不挂、现在**挂回来了**的(阶段 5,权威边界由 test/authority-boundary.test.mjs 钉死):
          # · `tool-todo` / `tool-subagent` / `tool-workflow` / `tool-ralph`:这些是**工作方式**,
          #   产不出一条 clearai 变更。「不挂」当年防的是「自己派一个来判自己」——评估者的派遣
          #   在内核里(auditProvider),与模型面的 subagent 是两层;后者派出去的只是干活的,
          #   它的结论要进账本,只能回到主线过观测准入。
