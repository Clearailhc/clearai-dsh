description: Evidence-first exploration (循证探索):先写判据再动手,完成要过观测准入、再经评估与证据推进,高等级结论由独立评估者裁决;进度与阶段全部由系统算出来。互斥方案分叉成世界线,各有一份工作副本,胜负由事先登记的尺子算出来——算不出来就停下问人。English: state the criterion before acting; completion passes admission and independent evaluation, never the doer's own word.
