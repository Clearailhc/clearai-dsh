<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">ClearAI 在 DSH 组合面上</title><desc id="d">ClearAI 将认识论循环映射到 DSH 宿主包、Agent 预设和客户端模块。</desc><rect width="960" height="430" rx="24" fill="#f8fafc"/><text x="480" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f172a">ClearAI 在 DSH 组合面上</text><g font-family="Inter,Arial,sans-serif"><rect x="70" y="100" width="250" height="230" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="355" y="100" width="250" height="230" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><rect x="640" y="100" width="250" height="230" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><g fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle"><text x="195" y="140">DSH 宿主包</text><text x="480" y="140">Agent 预设</text><text x="765" y="140">客户端模块</text></g><g fill="#334155" font-size="16" text-anchor="middle"><text x="195" y="185">投影</text><text x="195" y="215">fold</text><text x="195" y="245">读面</text><text x="195" y="275">API 路由</text><text x="480" y="185">认识论工具</text><text x="480" y="215">提示词</text><text x="480" y="245">闸门</text><text x="480" y="275">技能</text><text x="765" y="185">进展</text><text x="765" y="215">命题</text><text x="765" y="245">证据</text><text x="765" y="275">世界线</text></g></g><path d="M320 215 H350 M605 215 H635" stroke="#64748b" stroke-width="3"/><text x="480" y="380" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">一条认识论循环，三个组合面，一份派生记录。</text></svg>
